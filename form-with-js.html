<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="styling.css">

</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>

                <li><a href="form-with-js.html">Contact Me (with JS)</a></li>
            </ul>
        </nav>
        <button id="theme-switch" class="js-required" aria-label="Switch to dark theme" style="display: none;">
            Display Mode 🎀
        </button>
    </header>
    <main>
      <section>
        <h1>Contact Me</h1>
        <p>Please fill out the following form to get in touch &hearts;</p>
        <form id="contact-form" action="https://httpbin.org/post" method="post">
          <fieldset>
            <label for="firstName">First Name</label>
            <input type="text" name="firstName" id="firstName" autocomplete="given-name" minlength="1" maxlength="100" aria-describedby="form-error-area" required>

            <label for="lastName">Last Name</label>
            <input type="text" name="lastName" id="lastName" autocomplete="family-name" minlength="1" maxlength="100" aria-describedby="form-error-area" required>

            <label for="email">Email</label>
            <input type="email" name="email" id="email" autocomplete="email" aria-describedby="form-error-area" required>

            <label for="comments">Leave A Message (10-1,000 characters)</label>
            <textarea id="comments" name="comments" rows="5" cols="25" minlength="10" maxlength="1000" aria-describedby="form-error-area form-info-area" required></textarea>

            <!--hidden bot field-->
            <input type="hidden" name="possible_bot" value="true">
            <input type="hidden" name="form-errors" id="form-errors-input" value="[]">

            <!--js enhanced message areas-->
            <div id="form-error-area" class="message-box error-box" aria-live="polite" hidden></div>
            <div id="form-info-area" class="message-box info-box" aria-live="polite" hidden></div>

            <!--submit button-->
            <button type="submit">Submit &hearts;</button>
          </fieldset>
        </form>

      </section>
    </main>

        <div class="social-links">

        </div>
        <p>Made by Ailyn &lt;3</p>
